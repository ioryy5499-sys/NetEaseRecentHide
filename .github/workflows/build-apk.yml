
name: Build LSPosed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -q NetEaseRecentHide-GitHubActions-2.zip -d extracted
          test -f extracted/NetEaseRecentHide/app/build.gradle

      - name: Build debug APK
        run: |
          cd extracted/NetEaseRecentHide
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetEaseRecentHide-debug-apk
          path: extracted/NetEaseRecentHide/app/build/outputs/apk/debug/*.apk
